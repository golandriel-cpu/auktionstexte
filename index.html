<style>
:root { --bg: #FAF8F5; --card: #FFFDFA; --text: #26211D; --muted: #857B70; --border: #E2DBD0; --primary: #7A2E2E; --red: #B23A3A; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1A1714; --card: #211D19; --text: #EDE7DF; --muted: #A59A8E; --border: #3A342E; --primary: #B4554A; --red: #E07A7A; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #1A1714; --card: #211D19; --text: #EDE7DF; --muted: #A59A8E; --border: #3A342E; --primary: #B4554A; --red: #E07A7A; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
form { width: min(380px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; }
h1 { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-weight: 600; font-size: 26px; margin: 0 0 4px; }
p { margin: 0 0 18px; color: var(--muted); }
input[type="password"] { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: inherit; font: inherit; font-size: 17px; }
label { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 15px; }
label input { width: 18px; height: 18px; accent-color: var(--primary); }
button { width: 100%; min-height: 48px; margin-top: 18px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
button[disabled] { opacity: .5; }
#fehler { color: var(--red); margin: 12px 0 0; min-height: 1.5em; }
</style>
</head>

<form id="tor" hidden>
  <h1>Auktionstexte</h1>
  <p>Bitte Passwort eingeben.</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Passwort">
  <label><input type="checkbox" id="merken" checked> Auf diesem Gerät angemeldet bleiben</label>
  <button type="submit" id="los">Öffnen</button>

</form>

<script>
(function () {
  "use strict";
  var ITERATIONS = 600000;
  var STORE = "auktionstexte.schluessel";
  var raw = Uint8Array.from(atob(document.getElementById("auktionstexte-verschluesselt").textContent.trim()), function (c) { return c.charCodeAt(0); });
  var salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  var form = document.getElementById("tor"), pw = document.getElementById("pw"), btn = document.getElementById("los"), err = document.getElementById("fehler");

  function decrypt(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function show(html) {
    // erst ersetzen, wenn diese Seite fertig geladen ist – sonst würde die App nur angehängt
    if (document.readyState !== "complete") { window.addEventListener("load", function () { setTimeout(function () { show(html); }, 0); }); return; }
    document.open(); document.write(html); document.close();
  }
  function ask() { form.hidden = false; pw.focus(); }
  function getStored() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function setStored(v) { try { v ? localStorage.setItem(STORE, v) : localStorage.removeItem(STORE); } catch (e) {} }

  if (!window.crypto || !crypto.subtle) { form.hidden = false; err.textContent = "Dieser Browser kann die App nicht entschlüsseln (nur über https möglich)."; btn.disabled = true; return; }

  var stored = getStored();
  if (stored) {
    var bytes = Uint8Array.from(atob(stored), function (c) { return c.charCodeAt(0); });
    crypto.subtle.importKey("raw", bytes, "AES-GCM", false, ["decrypt"]).then(decrypt).then(show, function () { setStored(null); ask(); });
  } else ask();

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    btn.disabled = true; btn.textContent = "Prüfe …"; err.textContent = "";
    crypto.subtle.importKey("raw", new TextEncoder().encode(pw.value), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      })
      .then(function (key) {
        return decrypt(key).then(function (html) {
          if (!document.getElementById("merken").checked) return html;
          return crypto.subtle.exportKey("raw", key).then(function (k) {
            setStored(btoa(String.fromCharCode.apply(null, new Uint8Array(k))));
            return html;
          });
        });
      })
      .then(show, function () {
        btn.disabled = false; btn.textContent = "Öffnen"; err.textContent = "Falsches Passwort."; pw.select();
      });
  });
})();
</script>
